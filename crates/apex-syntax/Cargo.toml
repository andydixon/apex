[package]
name = "apex-syntax"
description = "Tree-sitter based incremental syntax highlighting, folding and symbols for Apex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
apex-buffer.workspace = true
apex-edit.workspace = true
