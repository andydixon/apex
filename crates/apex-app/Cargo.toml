[package]
name = "apex-app"
description = "The Apex text editor application binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "apex"

[[bin]]
name = "apex"
path = "src/main.rs"

[dependencies]
apex-ui.workspace = true
apex-project.workspace = true
eframe.workspace = true
egui.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSURL", "NSString", "NSObject"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
