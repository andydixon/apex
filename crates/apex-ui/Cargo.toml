[package]
name = "apex-ui"
description = "egui user interface for Apex: editor widget, panes, palette and settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
git2.workspace = true
fastrand = "2"
directories.workspace = true
apex-buffer.workspace = true
apex-edit.workspace = true
apex-project.workspace = true
apex-syntax.workspace = true
egui.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
thiserror.workspace = true
nucleo-matcher.workspace = true
regex.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true

encoding_rs.workspace = true
eframe.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux and Windows dialogs come from rfd; macOS uses AppKit directly in
# macos_dialogs.rs (see there for why), so rfd is not built on macOS.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rfd.workspace = true

# Only the AppKit features macos_dialogs.rs touches.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "CFRunLoop"] }

[dev-dependencies]
tempfile = "3"
