[[snippets]]
trigger = "html5"
description = "HTML5 document"
body = "<!DOCTYPE html>\n<html lang=\"${1:en}\">\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    <title>${2:Title}</title>\n</head>\n<body>\n    $0\n</body>\n</html>"

[[snippets]]
trigger = "div"
description = "div"
body = "<div${1: class=\"$2\"}>\n    $0\n</div>"

[[snippets]]
trigger = "a"
description = "link"
body = "<a href=\"${1:#}\">${2:text}</a>$0"

[[snippets]]
trigger = "img"
description = "image"
body = "<img src=\"${1}\" alt=\"${2}\">$0"
