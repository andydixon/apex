[[snippets]]
trigger = "shebang"
description = "Bash shebang with strict mode"
body = "#!/usr/bin/env bash\nset -euo pipefail\n$0"

[[snippets]]
trigger = "if"
description = "if"
body = "if [[ ${1:condition} ]]; then\n    $0\nfi"

[[snippets]]
trigger = "for"
description = "for loop"
body = "for ${1:item} in ${2:list}; do\n    $0\ndone"

[[snippets]]
trigger = "fn"
description = "Function"
body = "${1:name}() {\n    $0\n}"
