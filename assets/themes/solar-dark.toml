# Solar Dark — a Solarized-inspired dark palette (original colour values, not a copy of any theme file).
name = "Solar Dark"
dark = true

[ui]
background = "#00212b"
surface = "#002b36"
surface_raised = "#073642"
border = "#001a21"
text = "#93a1a1"
text_muted = "#657b83"
accent = "#268bd2"
tab_active = "#002b36"
tab_inactive = "#00212b"
tab_text_active = "#eee8d5"
tab_text_inactive = "#657b83"
status_bar = "#00212b"
sidebar = "#00212b"
panel = "#00212b"
menu = "#073642"
hover = "#0b4150"
selection = "#0f4a5c"

[editor]
background = "#002b36"
foreground = "#93a1a1"
gutter_background = "#002b36"
line_number = "#4a6670"
line_number_active = "#93a1a1"
current_line = "#073642"
selection = "#0f4a5c"
selection_inactive = "#0a3a48"
caret = "#eee8d5"
whitespace = "#214b55"
indent_guide = "#0a3a48"
indent_guide_active = "#1b5260"
bracket_match = "#b58900"
search_match = "#5c4a00"
search_match_current = "#b58900"

[syntax]
comment = { fg = "#586e75", italic = true }
keyword = "#859900"
"keyword.control" = "#859900"
"keyword.operator" = "#859900"
operator = "#93a1a1"
string = "#2aa198"
"string.escape" = "#cb4b16"
number = "#d33682"
constant = "#cb4b16"
boolean = "#cb4b16"
type = "#b58900"
function = "#268bd2"
constructor = "#b58900"
variable = "#93a1a1"
"variable.builtin" = "#dc322f"
"variable.parameter" = "#839496"
property = "#268bd2"
attribute = "#cb4b16"
tag = "#268bd2"
punctuation = "#839496"
"markup.heading" = { fg = "#268bd2", bold = true }
