# Midnight — deep blue-black with cool accents.
name = "Midnight"
dark = true

[ui]
background = "#0f1117"
surface = "#151823"
surface_raised = "#1c2030"
border = "#0a0b10"
text = "#c8cfe0"
text_muted = "#7a839c"
accent = "#7aa2f7"
tab_active = "#11131b"
tab_inactive = "#151823"
status_bar = "#0d0f15"
sidebar = "#12141c"
panel = "#12141c"
menu = "#1a1e2c"
hover = "#232839"
selection = "#283457"

[editor]
background = "#11131b"
foreground = "#c8cfe0"
gutter_background = "#11131b"
line_number = "#3f4660"
line_number_active = "#9aa5c8"
current_line = "#171a25"
selection = "#283457"
selection_inactive = "#1f2640"
caret = "#dfe5f7"
whitespace = "#2a3045"
indent_guide = "#1f2434"
indent_guide_active = "#323a52"
bracket_match = "#7aa2f7"
search_match = "#3d4a1f"
search_match_current = "#7a8a2a"

[syntax]
comment = { fg = "#565f89", italic = true }
keyword = "#bb9af7"
"keyword.control" = "#bb9af7"
"keyword.operator" = "#89ddff"
operator = "#89ddff"
string = "#9ece6a"
"string.escape" = "#89ddff"
number = "#ff9e64"
constant = "#ff9e64"
boolean = "#ff9e64"
type = "#2ac3de"
"type.builtin" = "#2ac3de"
function = "#7aa2f7"
"function.macro" = "#7dcfff"
constructor = "#2ac3de"
variable = "#c8cfe0"
"variable.builtin" = "#f7768e"
"variable.parameter" = "#e0af68"
property = "#73daca"
attribute = "#e0af68"
tag = "#f7768e"
punctuation = "#89ddff"
"markup.heading" = { fg = "#7aa2f7", bold = true }
