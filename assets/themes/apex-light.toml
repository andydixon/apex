# Apex Light — a calm light scheme with warm neutrals.
name = "Apex Light"
dark = false

[ui]
background = "#f3f4f6"
surface = "#eceef1"
surface_raised = "#ffffff"
border = "#d7dae0"
text = "#2a2f38"
text_muted = "#6c7480"
accent = "#2f6fd6"
accent_text = "#ffffff"
tab_active = "#fbfbfc"
tab_inactive = "#eceef1"
tab_text_active = "#1f242c"
tab_text_inactive = "#6c7480"
status_bar = "#e6e8ec"
sidebar = "#eef0f3"
panel = "#eef0f3"
menu = "#ffffff"
hover = "#e2e5ea"
selection = "#c9dcf7"
warning = "#b07d12"
error = "#c92a3b"
success = "#2e8b3d"
scrollbar = "#c9cdd4"
scrollbar_hover = "#aeb4bd"

[editor]
background = "#fbfbfc"
foreground = "#2a2f38"
gutter_background = "#fbfbfc"
line_number = "#b0b6bf"
line_number_active = "#596270"
current_line = "#f0f2f5"
selection = "#c9dcf7"
selection_inactive = "#dfe6f0"
caret = "#1f242c"
caret_secondary = "#4b6fa8"
whitespace = "#d3d7dd"
indent_guide = "#e6e8ec"
indent_guide_active = "#cbd0d8"
ruler = "#e6e8ec"
bracket_match = "#2f6fd6"
search_match = "#fde9a6"
search_match_current = "#f7c948"
word_highlight = "#e8edf5"
fold_marker = "#6c7480"
git_added = "#3aa655"
git_modified = "#2f6fd6"
git_deleted = "#d4414f"
diagnostic_error = "#c92a3b"
diagnostic_warning = "#b07d12"
diagnostic_info = "#2f6fd6"
minimap_viewport = "#00000012"

[syntax]
comment = { fg = "#8a929e", italic = true }
keyword = "#a626a4"
"keyword.control" = "#a626a4"
"keyword.operator" = "#0184bc"
operator = "#4a5260"
string = "#50a14f"
"string.escape" = "#0184bc"
"string.special" = "#c18401"
number = "#986801"
constant = "#986801"
"constant.builtin" = "#986801"
boolean = "#986801"
type = "#c18401"
"type.builtin" = "#c18401"
function = "#4078f2"
"function.method" = "#4078f2"
"function.macro" = "#0184bc"
"function.builtin" = "#0184bc"
constructor = "#c18401"
variable = "#2a2f38"
"variable.builtin" = "#e45649"
"variable.parameter" = "#a0522d"
"variable.member" = "#e45649"
property = "#e45649"
attribute = "#986801"
label = "#e45649"
namespace = "#c18401"
module = "#c18401"
tag = "#e45649"
"tag.attribute" = "#986801"
punctuation = "#4a5260"
"punctuation.bracket" = "#4a5260"
"punctuation.delimiter" = "#4a5260"
"punctuation.special" = "#0184bc"
"markup.heading" = { fg = "#4078f2", bold = true }
"markup.bold" = { fg = "#2a2f38", bold = true }
"markup.italic" = { fg = "#2a2f38", italic = true }
"markup.link" = { fg = "#0184bc", underline = true }
"markup.raw" = "#50a14f"
"markup.list" = "#a626a4"
"markup.quote" = { fg = "#6c7480", italic = true }
"diff.plus" = "#50a14f"
"diff.minus" = "#e45649"
"diff.delta" = "#4078f2"
error = { fg = "#c92a3b", underline = true }
embedded = "#2a2f38"
