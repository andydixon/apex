# Solar Light — a Solarized-inspired light palette (original colour values).
name = "Solar Light"
dark = false

[ui]
background = "#eee8d5"
surface = "#f5efdc"
surface_raised = "#fdf6e3"
border = "#d3cbb7"
text = "#586e75"
text_muted = "#93a1a1"
accent = "#268bd2"
tab_active = "#fdf6e3"
tab_inactive = "#eee8d5"
tab_text_active = "#073642"
tab_text_inactive = "#93a1a1"
status_bar = "#eee8d5"
sidebar = "#f5efdc"
panel = "#f5efdc"
menu = "#fdf6e3"
hover = "#e4ddc6"
selection = "#d6e8f2"

[editor]
background = "#fdf6e3"
foreground = "#586e75"
gutter_background = "#fdf6e3"
line_number = "#b5ab93"
line_number_active = "#586e75"
current_line = "#eee8d5"
selection = "#d6e8f2"
selection_inactive = "#e6eef2"
caret = "#073642"
whitespace = "#d3cbb7"
indent_guide = "#e9e2cc"
indent_guide_active = "#cfc7b0"
bracket_match = "#b58900"
search_match = "#f3e2a0"
search_match_current = "#e3b900"

[syntax]
comment = { fg = "#93a1a1", italic = true }
keyword = "#859900"
"keyword.control" = "#859900"
"keyword.operator" = "#859900"
operator = "#586e75"
string = "#2aa198"
"string.escape" = "#cb4b16"
number = "#d33682"
constant = "#cb4b16"
boolean = "#cb4b16"
type = "#b58900"
function = "#268bd2"
constructor = "#b58900"
variable = "#586e75"
"variable.builtin" = "#dc322f"
"variable.parameter" = "#657b83"
property = "#268bd2"
attribute = "#cb4b16"
tag = "#268bd2"
punctuation = "#657b83"
"markup.heading" = { fg = "#268bd2", bold = true }
