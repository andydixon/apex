# Apex Dark — the default colour scheme.
name = "Apex Dark"
dark = true

[ui]
background = "#1b1d21"
surface = "#22252a"
surface_raised = "#2a2e34"
border = "#111214"
text = "#d6d9de"
text_muted = "#8b919b"
accent = "#5b9bf5"
accent_text = "#ffffff"
tab_active = "#1e2025"
tab_inactive = "#22252a"
tab_text_active = "#eaecef"
tab_text_inactive = "#8b919b"
status_bar = "#1a1c20"
sidebar = "#1f2125"
panel = "#1f2125"
menu = "#262a30"
hover = "#30353c"
selection = "#2f4f7a"
warning = "#e5c07b"
error = "#e06c75"
success = "#98c379"
scrollbar = "#3a3f47"
scrollbar_hover = "#4a505a"

[editor]
background = "#1e2025"
foreground = "#d6d9de"
gutter_background = "#1e2025"
line_number = "#555b66"
line_number_active = "#aab0ba"
current_line = "#24272d"
selection = "#2f4f7a"
selection_inactive = "#2a3340"
caret = "#f0f2f5"
caret_secondary = "#9fb8dd"
whitespace = "#3d424b"
indent_guide = "#2c3038"
indent_guide_active = "#3f444d"
ruler = "#2c3038"
bracket_match = "#5b9bf5"
search_match = "#6b5a1e"
search_match_current = "#a8842a"
word_highlight = "#2b3441"
fold_marker = "#8b919b"
git_added = "#5fb86b"
git_modified = "#4f9fe0"
git_deleted = "#e05c5c"
diagnostic_error = "#e06c75"
diagnostic_warning = "#e5c07b"
diagnostic_info = "#61afef"
minimap_viewport = "#ffffff14"

[syntax]
comment = { fg = "#6a7380", italic = true }
keyword = "#c678dd"
"keyword.control" = "#c678dd"
"keyword.operator" = "#56b6c2"
operator = "#9da5b4"
string = "#98c379"
"string.escape" = "#56b6c2"
"string.special" = "#d19a66"
number = "#d19a66"
constant = "#d19a66"
"constant.builtin" = "#d19a66"
boolean = "#d19a66"
type = "#e5c07b"
"type.builtin" = "#e5c07b"
function = "#61afef"
"function.method" = "#61afef"
"function.macro" = "#56b6c2"
"function.builtin" = "#56b6c2"
constructor = "#e5c07b"
variable = "#d6d9de"
"variable.builtin" = "#e06c75"
"variable.parameter" = "#e0a97f"
"variable.member" = "#e06c75"
property = "#e06c75"
attribute = "#d19a66"
label = "#e06c75"
namespace = "#e5c07b"
module = "#e5c07b"
tag = "#e06c75"
"tag.attribute" = "#d19a66"
punctuation = "#9da5b4"
"punctuation.bracket" = "#9da5b4"
"punctuation.delimiter" = "#9da5b4"
"punctuation.special" = "#56b6c2"
"markup.heading" = { fg = "#61afef", bold = true }
"markup.bold" = { fg = "#d6d9de", bold = true }
"markup.italic" = { fg = "#d6d9de", italic = true }
"markup.link" = { fg = "#56b6c2", underline = true }
"markup.raw" = "#98c379"
"markup.list" = "#c678dd"
"markup.quote" = { fg = "#8b919b", italic = true }
"diff.plus" = "#98c379"
"diff.minus" = "#e06c75"
"diff.delta" = "#61afef"
error = { fg = "#e06c75", underline = true }
embedded = "#d6d9de"
