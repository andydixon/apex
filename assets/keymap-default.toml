# Default key bindings for Apex.
#
# "primary" is Ctrl on Linux/Windows and Cmd on macOS. Chords are written with
# a space between steps: "primary+k primary+b". Contexts: global (default),
# editor, find, overlay, sidebar. Later entries override earlier ones with the
# same keys and context. User overrides live in <config>/keymap.toml.

[[bindings]]
keys = "primary+shift+p"
command = "goto.commands"
[[bindings]]
keys = "primary+p"
command = "goto.anything"
[[bindings]]
keys = "primary+g"
command = "goto.line"
[[bindings]]
keys = "primary+r"
command = "goto.symbol"
[[bindings]]
keys = "primary+shift+r"
command = "goto.project_symbol"
[[bindings]]
keys = "f12"
command = "goto.definition"
[[bindings]]
keys = "shift+f12"
command = "goto.references"
[[bindings]]
keys = "alt+minus"
command = "goto.back"
[[bindings]]
keys = "alt+shift+minus"
command = "goto.forward"

